<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Hors-Ligne — Agro-Capital</title>
  <meta name="theme-color" content="#059669">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #022c22 0%, #0f172a 50%, #064e3b 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .container {
      max-width: 440px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 2rem;
      padding: 2.5rem 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo-box {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #34d399 0%, #059669 100%);
      border-radius: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
    }
    .logo-box svg {
      width: 44px;
      height: 44px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }
    .highlight {
      color: #34d399;
    }
    p {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
    }
    .btn {
      width: 100%;
      background: #059669;
      color: #ffffff;
      border: none;
      padding: 0.9rem 1.5rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(5, 150, 105, 0.3);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-box">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M16 6 C10 6 7 12 8 19 C10 17 13 15 16 15 C19 15 22 17 24 19 C25 12 22 6 16 6Z" fill="#dcfce7" />
        <path d="M16 15 L16 26" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" />
        <path d="M16 20 L12 17" stroke="#facc15" stroke-width="2" stroke-linecap="round" />
        <path d="M16 22 L20 19" stroke="#facc15" stroke-width="2" stroke-linecap="round" />
      </svg>
    </div>

    <div class="badge">
      <span class="badge-dot"></span>
      <span>Mode Hors-Ligne</span>
    </div>

    <h1>Agro<span class="highlight">Capital</span></h1>

    <p>
      Vous êtes actuellement hors connexion internet. Vos données enregistrées et pages précédemment consultées restent disponibles en cache.
    </p>

    <button class="btn" onclick="window.location.reload()">
      🔄 Réessayer la connexion
    </button>

    <div class="footer-note">
      Agro-Capital · Djanta 2026 · Togo 🇹🇬
    </div>
  </div>

  <script>
    // Rechargement automatique dès que la connexion internet est rétablie
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
